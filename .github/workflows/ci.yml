name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs-site/**"
  pull_request:
    paths-ignore:
      - "docs-site/**"
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome linter
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run tsc:check

      - name: Check Worker/API DB boundary
        run: bash scripts/check-db-boundary.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A bare `bun test` prints failures to stderr, which the Actions log
      # interleaves so badly that a red run does not tell you which test broke.
      # The JUnit report is uploaded regardless of outcome so failures are
      # diagnosable from the run page rather than by guessing.
      - name: Run tests
        run: bun test --reporter=junit --reporter-outfile=./junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn

      # Starts the real API server and drives a task into dead_letter through
      # /api/poll and the heartbeat, requeues it with the dashboard's request,
      # and checks a worker gets it again. Also checks the approval timeout.
      - name: Dead-letter flow end to end
        run: bun run e2e:dead-letter

  # Its own job so it runs beside the others instead of after them. Builds the
  # dashboard, starts the real API server, parks a task in dead_letter, and
  # clicks Requeue in headless Chromium. The Playwright trace and screenshot are
  # uploaded only when it fails.
  dashboard-e2e:
    name: Dashboard End to End
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser download is cached by Playwright version. The system
      # libraries Chromium needs are not part of that cache, so the install
      # step below still runs and only skips the download on a hit.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Dashboard flow end to end
        run: bun run e2e:dashboard

      - name: Upload Playwright trace and screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: test-results/dashboard
          if-no-files-found: warn

  memory-eval:
    name: Memory Retrieval Eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uses the offline hash embedding provider, so this needs no API key and
      # costs nothing. The threshold is a regression floor well under the ~87%
      # currently reached, not a target: it should trip on a real retrieval
      # break, not on scoring noise.
      - name: Score memory retrieval
        run: bun src/cli.tsx eval --min-hit-at 10=0.75
