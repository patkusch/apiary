allowBuilds:
  esbuild: true

overrides:
  # Patches security advisories in packages whose declared range can't reach
  # the fix on its own — see the commit message for why each is pinned here
  # instead of bumping its parent (streamdown 2.6.0 drops mermaid entirely).
  mermaid: ^11.17.2
  dompurify: ^3.4.15
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  uuid: ^11.1.1
  # vite's own bundled toolchain — patch/minor only, no majors (nanoid pinned
  # to the last 3.x release rather than 6.x, which dropped CJS).
  postcss: ^8.5.28
  nanoid: ^3.3.19
  picomatch: ^4.0.7
  browserslist: ^4.29.0
  esbuild: ^0.28.2
  "@babel/core": ^7.29.7
  baseline-browser-mapping: ^2.11.25

